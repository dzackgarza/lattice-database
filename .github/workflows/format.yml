name: format
'on':
  schedule:
    # Nightly, 06:00 UTC. The commit gate leaves lattices/ to this job (justfile,
    # ai_review_ci_format_scheduled_dirs).
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: format
  cancel-in-progress: false
jobs:
  format-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        # The default cache-dependency-glob walks all 161k files of the checkout and overflows
        # the action's stack; there is no lockfile for a cache key to hash.
        with:
          enable-cache: false
      - name: Install just
        run: sudo apt-get install --yes just
      - name: Install pandoc-flowmark (pinned)
        run: |
          tag=flowmark-3.10.2-4
          curl -sSL -o /tmp/pandoc-flowmark.tar.gz "https://github.com/dzackgarza/pandoc/releases/download/$tag/$tag-linux-amd64.tar.gz"
          echo "50ce56aa651ce19e94a7c9f2d0376f3b09510396659f5e39a56fff9f3a83d2a9  /tmp/pandoc-flowmark.tar.gz" | sha256sum -c -
          tar xzf /tmp/pandoc-flowmark.tar.gz -C /tmp
          sudo install -m755 "/tmp/$tag-linux-amd64/pandoc-flowmark" /usr/local/bin/pandoc-flowmark
          pandoc-flowmark --version | head -1
      - run: just format-cards
      - name: Commit the formatted cards
        run: |
          git add lattices
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Format lattice cards"
          git push
