name: certify
'on':
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch:
    inputs:
      tag:
        description: Certify one lattice tag while debugging this workflow; omit for the full corpus.
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: certify
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Reserve time to persist results
        run: echo "CERTIFY_DEADLINE=$(( $(date +%s) + 340 * 60 ))" >> "$GITHUB_ENV"
      - name: Check out (actions/checkout v4)
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
      - name: Provision the shared Sage environment
        uses: ./.github/actions/sage
      - name: Compute and certify uncertified card values
        env:
          LATTICEDB_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          # Include provisioning in the job budget and reserve ten minutes for persistence.
          minutes=$(( (CERTIFY_DEADLINE - $(date +%s)) / 60 ))
          (( minutes > 0 ))
          if (( minutes > 330 )); then minutes=330; fi
          args=(--minutes "$minutes")
          if [[ -n "$LATTICEDB_TAG" ]]; then
            args+=(--tag "$LATTICEDB_TAG")
          fi
          # The timeout runs inside the container, so it ends the certify process itself
          # before the commit step reads the cards and `exceeded.yaml`.
          docker exec -i \
            --env "PYTHONPATH=$GITHUB_WORKSPACE/research/src:$GITHUB_WORKSPACE/src" \
            --workdir "$GITHUB_WORKSPACE" \
            sage-env timeout "${minutes}m" /sage/.venv/bin/python -m latticedb certify "${args[@]}"
      - name: Commit completed computations to main
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add lattices certificates.yaml exceeded.yaml
          if git diff --cached --quiet; then
            echo "No newly completed computations."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: certify computed card values'

          staging_branch="certify-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${staging_branch}"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Computed values conflict with current main; durable result remains on ${staging_branch}."
              exit 1
            fi
            if git push origin HEAD:main; then
              git push origin --delete "${staging_branch}"
              exit 0
            fi
            echo "main advanced during push attempt ${attempt}; rebasing and retrying."
          done

          echo "::error::Could not integrate computed values into main after 5 attempts; durable result remains on ${staging_branch}."
          exit 1
      - name: Stop the Sage environment
        if: always()
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: docker rm --force sage-env >/dev/null 2>&1 || true
