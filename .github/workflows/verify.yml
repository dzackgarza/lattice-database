name: verify
'on':
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch:
    inputs:
      tags:
        description: Lattice tags to verify, separated by spaces; omit for the whole corpus. A tag is verified in its shard, so the run verifies the shards that hold the tags named here.
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: verify
  cancel-in-progress: false
env:
  # One shard's process reads every card and then holds its own shard's preamble structures: about
  # 7.5 GiB of validated cards and 1.9 GiB of certificates before the mathematics, on a runner whose
  # memory the image and its Julia bridge also use. That is where the scheduled runs died (exit 137,
  # #6), so every shard job states the ceiling it is given here and reports the peak it needed.
  # Eight gibibytes, not sixteen: a hosted runner has about fourteen gigabytes of free disk, and its
  # own swap file already occupies part of that (#26).
  SWAP_GIB: 8
jobs:
  plan:
    # Sixteen jobs, one per shard, so one shard of the corpus is one job's memory: a shard killed
    # for memory fails its own job and names itself, and the other fifteen still verify their cards.
    # `latticedb verify` takes a shard and not a tag, so a dispatch of tags narrows the run to the
    # shards that hold them, which is the finest selection the command offers.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Expand the tags input into the job matrix
        id: plan
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          TAGS: ${{ github.event.inputs.tags || '' }}
        run: |
          mapfile -t named < <(printf '%s' "$TAGS" | tr -s '[:space:]' '\n' | sed '/^$/d' | awk '!seen[$0]++')
          shards=()
          if (( ${#named[@]} == 0 )); then
            # Without a list the run verifies the whole corpus, in sixteen shards.
            for shard in $(seq 0 15); do
              shards+=("$shard")
            done
          else
            for tag in "${named[@]}"; do
              # The tag reaches a shell argument, so it is checked here.
              if [[ ! "$tag" =~ ^[0-9A-Z]+$ ]]; then
                echo "not a lattice tag: $tag" >&2
                exit 1
              fi
              # The shard of a tag is the rule `certificates.tag_hash` applies: the first eight
              # bytes of the SHA-256 of the tag, big endian, modulo the shard count.
              shards+=("$(python3 -c 'import hashlib, sys; print(int.from_bytes(hashlib.sha256(sys.argv[1].encode()).digest()[:8], "big") % 16)' "$tag")")
            done
            mapfile -t shards < <(printf '%s\n' "${shards[@]}" | sort -n -u)
          fi
          entries=()
          for shard in "${shards[@]}"; do
            entries+=("{\"shard\":$shard}")
          done
          matrix="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
          printf '%s\n' "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  cards:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SHARDS: 16
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out (actions/checkout v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Give this shard its swap and state its memory ceiling
        run: |
          # A hosted runner already has an *active* /swapfile, and writing that path while it is in
          # use fails with "Text file busy" (#26). Turn the runner's own swap off, then allocate,
          # enable and state this job's ceiling. Every command here must succeed: a runner that will
          # not give the swap fails the job rather than running the verification under a ceiling the
          # workflow did not state.
          free -h
          sudo swapoff -a
          sudo fallocate -l "${SWAP_GIB}G" /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "memory ceiling: ${SWAP_GIB} GiB swap on top of the runner's RAM"
          free -h
      - name: Provision the shared Sage environment
        uses: ./.github/actions/sage
      - name: Verify lattice cards and certificate hashes
        run: |
          # The command reports `memory: ... peak for this process` before it refuses its problems,
          # so this shard's log carries the ceiling the shard needed.
          docker exec -i --workdir "$GITHUB_WORKSPACE" \
            --env "PYTHONPATH=$GITHUB_WORKSPACE/research/src:$GITHUB_WORKSPACE/src" \
            sage-env /sage/.venv/bin/python -m latticedb verify --shard "${{ matrix.shard }}/$SHARDS"
      - name: Stop the Sage environment
        if: always()
        run: docker rm --force sage-env
    name: Stored cards and certificates, shard ${{ matrix.shard }}/16
