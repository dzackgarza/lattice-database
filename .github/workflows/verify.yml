name: verify
'on':
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out (actions/checkout v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Provision the shared Sage environment
        uses: ./.github/actions/sage
      - name: Verify lattice cards and certificate hashes
        run: |
          docker exec -i --workdir "$GITHUB_WORKSPACE" \
            --env "PYTHONPATH=$GITHUB_WORKSPACE/research/src:$GITHUB_WORKSPACE/src" \
            sage-env /sage/.venv/bin/python -m latticedb verify
      - name: Validate preamble owner contracts
        run: |
          docker exec -i --workdir "$GITHUB_WORKSPACE/research" \
            --env "PYTHONPATH=$GITHUB_WORKSPACE/research/src" \
            sage-env /sage/.venv/bin/python -c 'import sage.all, sys, pytest; sys.exit(pytest.main(sys.argv[1:]))' \
            tests/lattices/test_lattice_database_owner_contracts.py \
            tests/lattices/test_coordinate_diagonal_embeddings.py
      - name: Validate lattice database integration
        run: |
          docker exec -i --workdir "$GITHUB_WORKSPACE" \
            --env "PYTHONPATH=$GITHUB_WORKSPACE/research/src:$GITHUB_WORKSPACE/src" \
            sage-env /sage/.venv/bin/python -m pytest \
            tests/test_catalogue_schemas.py \
            tests/test_corpus.py \
            tests/test_genus.py \
            tests/test_geometric.py \
            tests/test_hashimoto.py \
            tests/test_records.py \
            tests/validation
      - name: Check source intake provenance
        run: |
          docker exec -i --workdir "$GITHUB_WORKSPACE" \
            --env "PYTHONPATH=$GITHUB_WORKSPACE/research/src:$GITHUB_WORKSPACE/src" \
            sage-env /sage/.venv/bin/python -m pytest tests/test_bulk_sources.py tests/source_intake
      - name: Stop the Sage environment
        if: always()
        run: docker rm --force sage-env
