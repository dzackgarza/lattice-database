name: pages
'on':
  push:
    branches:
      - main
  workflow_dispatch: null
  workflow_run:
    workflows:
      - certify
    types:
      - completed
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Provision the shared Sage environment
        uses: ./.github/actions/sage
      - name: Install pandoc
        run: |
          curl --fail --location --output pandoc.deb https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-1-amd64.deb
      - name: Build the lattice database
        run: |
          docker exec -i sage-env apt-get update
          docker exec -i sage-env apt-get install --yes "$GITHUB_WORKSPACE/pandoc.deb"
          docker exec -i \
            --env "PYTHONPATH=$GITHUB_WORKSPACE/research/src:$GITHUB_WORKSPACE/src" \
            sage-env /sage/.venv/bin/python -m latticedb build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Stop the Sage environment
        if: always()
        run: docker rm --force sage-env
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
