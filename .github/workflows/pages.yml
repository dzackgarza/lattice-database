name: pages
'on':
  push:
    branches:
      - main
  workflow_dispatch: null
  workflow_run:
    workflows:
      - certify
    types:
      - completed
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out the research preamble
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dzackgarza/research
          path: research
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
      - name: Install pandoc
        run: |
          curl --fail --location --output pandoc.deb https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-1-amd64.deb
          sudo apt-get install --yes ./pandoc.deb
      - name: Build the lattice database
        run: |
          docker run --rm --user root \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env PYTHONPATH=/workspace/research/src:/workspace/src \
            ghcr.io/dzackgarza/sage:develop bash -euc '
              /sage/.venv/bin/python -c "import sys, sage.all; assert sys.version_info >= (3, 14)"
              apt-get update
              apt-get install --yes /workspace/pandoc.deb
              uv pip install --python /sage/.venv/bin/python -e research -e .
              /sage/.venv/bin/python -m latticedb build
            '
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
