2MXI definite.spinor_regular:
  hash: 15c301adcda810bbf8c1146c855d5a7f9958a4414b4a91cc831ef934623d87cc
  by: 'W. C. Jagy, I. Kaplansky and A. Schiemann, There are 913 regular ternary forms,
    Mathematika 44 (1997), 332-341, form 94, as tabulated in A. G. Doyle, B. Muskat,
