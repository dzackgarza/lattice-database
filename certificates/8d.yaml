  hash: 48b625d971b5de3c16c9faf3de9dbba8d6992295461d2552c083b3ade4254b47
  by: 'W. C. Jagy, I. Kaplansky and A. Schiemann, There are 913 regular ternary forms,
    Mathematika 44 (1997), 332-341, form 2, as tabulated in A. G. Doyle, B. Muskat,
