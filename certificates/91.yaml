  hash: 7d45315015f1c3dce4e9a131a305030b7c0ceb6929184937deccd681ced56f98
  by: 'W. C. Jagy, I. Kaplansky and A. Schiemann, There are 913 regular ternary forms,
    Mathematika 44 (1997), 332-341, form 730, as tabulated in A. G. Doyle, B. Muskat,
