3I55 definite.spinor_regular:
  hash: a9b855de75444636d9485a8b862e4fe77042dbae9ef4f98047895658d22c36a3
  by: 'W. C. Jagy, I. Kaplansky and A. Schiemann, There are 913 regular ternary forms,
    Mathematika 44 (1997), 332-341, form 395, as tabulated in A. G. Doyle, B. Muskat,
    K. Pehlivan and K. S. Williams, Positive integers represented by regular primitive
    positive-definite integral ternary quadratic forms, Integers 19 (2019), #A45,
    Tables 1 and 2; regular by W. C. Jagy, I. Kaplansky and A. Schiemann, There are
    913 regular ternary forms, Mathematika 44 (1997), 332-341; hence spinor regular,
    since a form is spinor regular if it represents all the positive integers represented
    by its spinor genus (A. G. Earnest and A. Haensch, Completeness of the list of
    spinor regular ternary quadratic forms, arXiv:1711.05811v2 (2018), Abstract) and
    the spinor genus lies in the genus.'
