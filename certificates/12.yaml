2MNA definite.spinor_regular:
  hash: 51e5451a3286418c7b07a0bfae70dbe8043b2ffd230ee15abfee3473f15110ff
  by: 'W. C. Jagy, I. Kaplansky and A. Schiemann, There are 913 regular ternary forms,
