  by: 'W. C. Jagy, I. Kaplansky and A. Schiemann, There are 913 regular ternary forms,
    Mathematika 44 (1997), 332-341, form 872, as tabulated in A. G. Doyle, B. Muskat,
    K. Pehlivan and K. S. Williams, Positive integers represented by regular primitive
    positive-definite integral ternary quadratic forms, Integers 19 (2019), #A45,
    Tables 1 and 2; regular under the generalized Riemann hypothesis by R. J. Lemke
    Oliver, Representations by ternary quadratic forms, Bull. London Math. Soc. 46
    (2014), 1237-1247, Theorem 1.1; hence spinor regular, since a form is spinor regular
    if it represents all the positive integers represented by its spinor genus (A.
    G. Earnest and A. Haensch, Completeness of the list of spinor regular ternary
    quadratic forms, arXiv:1711.05811v2 (2018), Abstract) and the spinor genus lies
    in the genus.'
