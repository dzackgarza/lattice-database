    Acta Arith. 147 (2011), 233-243; hence spinor regular, since a form is spinor
    regular if it represents all the positive integers represented by its spinor genus
    (A. G. Earnest and A. Haensch, Completeness of the list of spinor regular ternary
    quadratic forms, arXiv:1711.05811v2 (2018), Abstract) and the spinor genus lies
    in the genus.'
