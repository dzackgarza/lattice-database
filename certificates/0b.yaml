2NHH definite.spinor_regular:
  hash: 9b4a2826073f5578dac71ab4df1e6e5462809e337b8785f293012fbdf3a0aaf1
  by: 'W. C. Jagy, I. Kaplansky and A. Schiemann, There are 913 regular ternary forms,
    Mathematika 44 (1997), 332-341, form 139, as tabulated in A. G. Doyle, B. Muskat,
