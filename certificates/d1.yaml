  hash: ad3fe9b4a794eb2d72e5e6dae4953ad166b9d937e2995e2eb063832aa5bd0c2b
  by: 'W. C. Jagy, I. Kaplansky and A. Schiemann, There are 913 regular ternary forms,
    Mathematika 44 (1997), 332-341, form 641, as tabulated in A. G. Doyle, B. Muskat,
