2NFW definite.spinor_regular:
  hash: 04f370364945ecac19f8321dd56e78ede8899c1eb0471212bf06cfe3c15ee803
  by: 'W. C. Jagy, I. Kaplansky and A. Schiemann, There are 913 regular ternary forms,
    Mathematika 44 (1997), 332-341, form 134, as tabulated in A. G. Doyle, B. Muskat,
