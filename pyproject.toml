[project]
name = "latticedb"
version = "0.1.0"
description = "Catalogue of lattices: one markdown file per lattice, validated metadata, static site"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    "python-flint>=0.9",
    "cyclopts>=3",
    "cypari2>=2.2.4",
    "markdown-it-py>=4.2.0",
    "pydantic-core",
    "MarkupSafe",
    "dzack-research @ git+https://github.com/dzackgarza/research.git@main",
]

[project.scripts]
latticedb = "latticedb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latticedb"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8",
    "types-PyYAML>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep diagnostics from evaluating representations of lazy preamble objects.
addopts = "--tb=short"

# Project category providers are the research preamble consumed by lookup.sage.
[tool.sage-mypy-category-plugin]
packages = ["dzack_research.preamble"]
